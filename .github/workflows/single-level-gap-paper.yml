name: single-level-gap paper

on:
  push:
    branches: [main]
    tags: ["single-level-gap-v*"]
    paths:
      - "single-level-gap/paper/**"
      - "single-level-gap/normgap/**"
      - ".github/workflows/single-level-gap-paper.yml"
  pull_request:
    paths:
      - "single-level-gap/paper/**"
      - "single-level-gap/normgap/**"
      - ".github/workflows/single-level-gap-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: single-level-gap

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build normgap
        working-directory: single-level-gap/normgap
        run: cargo build --release --locked

      - name: Check the adjacency circuit against field arithmetic (small fields)
        working-directory: single-level-gap/normgap
        run: |
          for kt in "1 2" "2 2" "3 2" "4 2" "1 3" "2 3" "1 4"; do
            ./target/release/normgap verify $kt | tee -a /tmp/verify.log
          done
          ! grep -v "mismatches=0 " /tmp/verify.log | grep -q 'mismatches='

      # The figure data must match what the program prints today.
      - name: Regenerate figure data and compare
        run: |
          for t in 2 3 4; do
            ./normgap/target/release/normgap dat "$t" 64 > "/tmp/gap-t$t.dat"
            diff -u "paper/figures/gap-t$t.dat" "/tmp/gap-t$t.dat"
          done

      - name: Compile PDF
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          working_directory: single-level-gap/paper
          root_file: single-level-gap.tex

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: single-level-gap-pdf
          path: single-level-gap/paper/single-level-gap.pdf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/single-level-gap-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: single-level-gap-pdf
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: single-level-gap.pdf
